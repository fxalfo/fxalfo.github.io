<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Seguro - Sistema de Consultas</title>
  <!-- CryptoJS para descifrado en el cliente -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <!-- Librería del escáner necesaria una vez desbloqueado -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    :root {
      --primary-color: #1e40af;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* Tarjeta de Inicio de Sesión */
    #gatekeeper-box {
      width: 100%;
      max-width: 380px;
      background: var(--card-bg);
      padding: 2rem 1.8rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    #gatekeeper-box h2 {
      margin: 0 0 8px 0;
      color: var(--primary-color);
      font-size: 1.4rem;
    }

    #gatekeeper-box p.subtitle {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 4px;
      color: #475569;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary-color);
    }

    .remember-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 12px 0 18px 0;
      font-size: 0.85rem;
      color: #64748b;
      cursor: pointer;
    }

    .remember-wrap input {
      cursor: pointer;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #1d3557;
    }

    #login-error {
      color: #dc2626;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 12px;
      display: none;
    }

    /* Contenedor dinámico donde se inyecta la app */
    #app-container {
      display: none;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>

  <!-- PANTALLA DE BLOQUEO -->
  <div id="gatekeeper-box">
    <h2>Maxibruno</h2>
    <p class="subtitle">Identifícate para ingresar al consultor</p>
    
    <div class="form-group">
      <label for="username">Usuario</label>
      <input type="text" id="username" autocomplete="username" placeholder="cedro" autofocus>
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••">
    </div>

    <label class="remember-wrap">
      <input type="checkbox" id="rememberMe" checked>
      <span>Recordar en este navegador</span>
    </label>

    <button class="btn-submit" onclick="unlockApp()">Ingresar</button>
    <div id="login-error">⚠️ Usuario o contraseña incorrectos</div>
  </div>

  <!-- APLICACIÓN DESBLOQUEADA -->
  <div id="app-container" style="display: none;"></div>

    // Verificar si ya había iniciado sesión previamente
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('app_auth_key') || sessionStorage.getItem('app_auth_key');
      if (savedKey) {
        attemptDecrypt(savedKey);
      }

      // Permitir enviar con Enter
      document.getElementById('password').addEventListener('keyup', (e) => {
        if (e.key === 'Enter') unlockApp();
      });
      document.getElementById('username').addEventListener('keyup', (e) => {
        if (e.key === 'Enter') document.getElementById('password').focus();
      });
    });

    function unlockApp() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const secret = `${u}:${p}`;
      attemptDecrypt(secret, true);
    }

    function attemptDecrypt(key, fromForm = false) {
      const errorEl = document.getElementById('login-error');
      try {
        const decrypted = CryptoJS.AES.decrypt(CIPHERTEXT, key);
        const html = decrypted.toString(CryptoJS.enc.Utf8);

        if (!html || !html.includes('Consultor de Precios')) {
          throw new Error('Clave incorrecta');
        }

        // Si marcó recordar datos
        if (fromForm) {
          const remember = document.getElementById('rememberMe').checked;
          if (remember) {
            localStorage.setItem('app_auth_key', key);
          } else {
            sessionStorage.setItem('app_auth_key', key);
          }
        }

        // Ocultar login
        document.getElementById('gatekeeper-box').style.display = 'none';

        // Inyectar HTML e inicializar scripts
        mountApplication(html);

      } catch (err) {
        if (fromForm) {
          errorEl.style.display = 'block';
        } else {
          // Si falló la clave guardada en caché, se borra
          localStorage.removeItem('app_auth_key');
          sessionStorage.removeItem('app_auth_key');
        }
      }
    }

    function mountApplication(htmlString) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlString, 'text/html');

      // 1. Inyectar estilos originales
      const styles = doc.querySelectorAll('style');
      styles.forEach(s => document.head.appendChild(s));

      // 2. Inyectar el contenedor
      const container = doc.querySelector('.container');
      const appContainer = document.getElementById('app-container');
      appContainer.innerHTML = '';
      appContainer.appendChild(container);
      appContainer.style.display = 'block';

      // 3. Ejecutar los scripts de la app original
      const scripts = doc.querySelectorAll('script');
      scripts.forEach(oldScript => {
        const newScript = document.createElement('script');
        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
        newScript.textContent = oldScript.textContent;
        document.body.appendChild(newScript);
      });

      // Disparar carga de datos de la app
      if (typeof fetchData === 'function') {
        fetchData();
      }
    }
  </script>

</body>
