<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo POS - Exportación Formateada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        .flash-green {
            animation: flashGreen 1s ease-out;
        }
        @keyframes flashGreen {
            0% { background-color: #bbf7d0; }
            100% { background-color: transparent; }
        }
    </style>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-7xl mx-auto bg-white rounded-lg shadow-md p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Carga de Mercadería (Exportación Formateada)</h1>
            <div class="flex space-x-3">
                <div id="dbStatus" class="text-sm font-medium px-3 py-2 bg-yellow-100 text-yellow-800 rounded flex items-center">
                    ⏳ Conectando DB...
                </div>
                <button onclick="limpiarFactura()" class="bg-red-100 text-red-700 hover:bg-red-200 px-4 py-2 rounded shadow transition font-bold text-sm flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                    Limpiar / Nueva
                </button>
                <button onclick="exportarXLS()" class="bg-green-600 text-white hover:bg-green-700 px-4 py-2 rounded shadow transition font-bold text-sm flex items-center">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Exportar a POS (.XLS)
                </button>
            </div>
        </div>
        
        <!-- Cabecera Factura -->
        <div class="bg-blue-50 p-4 rounded-md mb-6 border border-blue-200">
            <h2 class="text-lg font-semibold text-blue-800 mb-3">1. Totales de Factura</h2>
            <div class="flex flex-wrap gap-6 items-end">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Total a Pagar (Factura Completa)</label>
                    <input type="number" id="facturaTotal" placeholder="Ej: 306628.85" class="mt-1 block w-48 rounded-md border-gray-300 shadow-sm p-3 border-2 focus:border-blue-500 focus:outline-none text-lg font-bold">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-500">Neto Gravado (Calculado Auto.)</label>
                    <input type="number" id="facturaNeto" value="0" readonly class="mt-1 block w-48 rounded-md border-gray-200 bg-gray-100 shadow-sm p-3 border focus:outline-none text-lg font-bold text-gray-500 cursor-not-allowed">
                </div>
                <div class="pb-2">
                    <span class="text-sm text-gray-600 block mb-1">Coeficiente Impositivo:</span>
                    <span id="coeficienteTag" class="font-bold text-blue-700 bg-blue-100 px-4 py-2 rounded text-lg">1.0000</span>
                </div>
            </div>
        </div>

        <!-- Grilla Productos -->
        <div>
            <h2 class="text-lg font-semibold text-gray-800 mb-3">2. Escaneo y Detalle de Productos</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 border">
                    <thead class="bg-gray-800">
                        <tr>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-100 uppercase">Cód. Barras</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-100 uppercase w-1/4">Producto</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-100 uppercase">Cantidad</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-100 uppercase">Importe Línea ($)</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-blue-300 uppercase">Costo Real</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-gray-100 uppercase">Margen (%)</th>
                            <th class="px-3 py-3 text-left text-xs font-medium text-green-400 uppercase">Precio Final ($)</th>
                            <th class="px-2 py-3"></th>
                        </tr>
                    </thead>
                    <tbody id="tablaProductos" class="bg-white divide-y divide-gray-200">
                        <!-- Las filas se inyectan acá -->
                    </tbody>
                </table>
            </div>
            <div class="mt-4 flex justify-between items-center">
                <button onclick="agregarFila()" class="bg-gray-800 text-white px-4 py-2 rounded shadow hover:bg-gray-700 transition font-bold">+ Agregar Fila Manual</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. LÓGICA DE BASE DE DATOS (GOOGLE SHEETS) ---
        let baseDeDatos = [];

        async function inicializarBaseDatos() {
            const url = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQXw6JguUct7dv50KyEPEQMqPD-WtOrBlfnWuMV_Yx91v5ty1YmNNXzZ9G-YPYlBw/pub?output=csv';
            try {
                const response = await fetch(url);
                const text = await response.text();
                parsearCSV(text);
                
                const statusDiv = document.getElementById('dbStatus');
                statusDiv.className = 'text-sm font-bold px-3 py-2 bg-green-100 text-green-800 rounded flex items-center';
                statusDiv.innerHTML = `✓ DB Conectada (${baseDeDatos.length})`;
            } catch (error) {
                const statusDiv = document.getElementById('dbStatus');
                statusDiv.className = 'text-sm font-bold px-3 py-2 bg-red-100 text-red-800 rounded flex items-center';
                statusDiv.innerHTML = '✗ Error Sheets';
                console.error("Error cargando CSV:", error);
            }
        }

        function parsearCSV(str) {
            const lineas = str.split('\n');
            baseDeDatos = [];
            
            for (let i = 1; i < lineas.length; i++) {
                if (!lineas[i].trim()) continue;
                
                let cols = [];
                let curr = '';
                let inQuote = false;
                for(let char of lineas[i]) {
                    if (char === '"') inQuote = !inQuote;
                    else if (char === ',' && !inQuote) { cols.push(curr); curr = ''; }
                    else curr += char;
                }
                cols.push(curr);

                baseDeDatos.push({
                    codigo: cols[0] ? cols[0].trim() : '',
                    descripcion: cols[1] ? cols[1].trim() : ''
                });
            }
        }

        // --- 2. LÓGICA DE EXPORTACIÓN Y LIMPIEZA ---
        function limpiarFactura() {
            if(confirm("¿Estás seguro de que deseas limpiar la pantalla? Se perderán los datos que no hayas exportado.")) {
                document.getElementById('facturaTotal').value = '';
                document.getElementById('facturaNeto').value = '0';
                document.getElementById('coeficienteTag').innerText = '1.0000';
                
                document.getElementById('tablaProductos').innerHTML = '';
                filaCount = 0;
                agregarFila(); // Comenzar con una fila limpia
            }
        }

        function exportarXLS() {
            let tablaHTML = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
            <head><meta charset="UTF-8"></head><body>
            <table border="1">
                <tr>
                    <th style="background-color:#333; color:white;">CODIGO</th>
                    <th style="background-color:#333; color:white;">CODEBAR</th>
                    <th style="background-color:#333; color:white;">NOMBRE</th>
                    <th style="background-color:#333; color:white;">P COSTO</th>
                    <th style="background-color:#333; color:white;">P VENTA</th>
                    <th style="background-color:#333; color:white;">P MAYOREO</th>
                    <th style="background-color:#333; color:white;">DEPARTAMENTO</th>
                    <th style="background-color:#333; color:white;">INVENTARIO</th>
                    <th style="background-color:#333; color:white;">IN MINIMO</th>
                </tr>`;

            const filas = document.querySelectorAll('.fila-producto');
            let hayDatos = false;

            filas.forEach(fila => {
                const id = fila.getAttribute('data-id');
                const codigo = document.getElementById(`codigo_${id}`).value.trim();
                const desc = document.getElementById(`desc_${id}`).value.trim();
                const cant = document.getElementById(`cant_${id}`).value || 0;
                const imp = document.getElementById(`imp_${id}`).value || 0;
                const costoText = document.getElementById(`costo_${id}`).innerText.replace('$', '').trim();
                const precioText = document.getElementById(`precio_${id}`).innerText.replace('$', '').trim();

                if(codigo || desc || parseFloat(imp) > 0) {
                    hayDatos = true;
                    // Mapeo: CODIGO y CODEBAR usan el mismo código de barras escaneado
                    // P MAYOREO lo dejamos en blanco para que lo llenen luego o lo calcule el sistema destino
                    // DEPARTAMENTO por defecto "GENERAL"
                    // IN MINIMO por defecto "1"
                    tablaHTML += `<tr>
                        <td style="mso-number-format:'\@'">${codigo}</td>
                        <td style="mso-number-format:'\@'">${codigo}</td>
                        <td>${desc}</td>
                        <td>${costoText.replace('.', ',')}</td>
                        <td>${precioText.replace('.', ',')}</td>
                        <td></td>
                        <td>GENERAL</td>
                        <td>${cant}</td>
                        <td>1</td>
                    </tr>`;
                }
            });

            if(!hayDatos) {
                alert("No hay productos cargados para exportar.");
                return;
            }

            tablaHTML += `</table></body></html>`;
            
            const blob = new Blob([tablaHTML], { type: 'application/vnd.ms-excel' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            
            const fechaHora = new Date().toISOString().replace(/T/, '_').replace(/\..+/, '').replace(/:/g, '-');
            link.download = `Importacion_POS_${fechaHora}.xls`;
            
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- 3. LÓGICA DE CÁLCULO Y VISTA ---
        let filaCount = 0;

        function recalcularSumaNeto() {
            let sumaNeto = 0;
            const inputsImporte = document.querySelectorAll('.input-importe');
            inputsImporte.forEach(input => {
                sumaNeto += parseFloat(input.value) || 0;
            });
            
            document.getElementById('facturaNeto').value = sumaNeto.toFixed(2);
            actualizarCoeficiente();
        }

        function actualizarCoeficiente() {
            const neto = parseFloat(document.getElementById('facturaNeto').value) || 0;
            const total = parseFloat(document.getElementById('facturaTotal').value) || 0;
            
            let coeficiente = 1;
            if (neto > 0 && total > 0) {
                coeficiente = total / neto;
            }
            
            document.getElementById('coeficienteTag').innerText = coeficiente.toFixed(4);
            recalcularTabla();
        }

        function recalcularFila(id) {
            const coeficiente = parseFloat(document.getElementById('coeficienteTag').innerText);
            
            const cantidad = parseFloat(document.getElementById(`cant_${id}`).value) || 0;
            const importe = parseFloat(document.getElementById(`imp_${id}`).value) || 0;
            const margen = parseFloat(document.getElementById(`margen_${id}`).value) || 0;
            
            let costoReal = 0;
            if (cantidad > 0) {
                costoReal = (importe * coeficiente) / cantidad;
            }
            
            document.getElementById(`costo_${id}`).innerText = `$${costoReal.toFixed(2)}`;
            
            const precioVenta = costoReal * (1 + (margen / 100));
            const precioRedondeado = Math.ceil(precioVenta / 10) * 10;
            
            document.getElementById(`precio_${id}`).innerText = `$${precioRedondeado.toFixed(2)}`;
        }

        function recalcularTabla() {
            const filas = document.querySelectorAll('.fila-producto');
            filas.forEach(fila => recalcularFila(fila.getAttribute('data-id')));
        }

        function manejarEscaner(e, id) {
            if (e.key === 'Enter') {
                e.preventDefault();
                buscarEnDb(id);
            }
        }

        function buscarEnDb(id) {
            const inputCodigo = document.getElementById(`codigo_${id}`);
            const codigo = inputCodigo.value.trim();
            if (!codigo) return;

            const productoEncontrado = baseDeDatos.find(p => p.codigo === codigo || p.codigo === codigo.replace(/^0+/, ''));

            if (productoEncontrado) {
                document.getElementById(`desc_${id}`).value = productoEncontrado.descripcion;
                
                inputCodigo.parentElement.classList.add('flash-green');
                setTimeout(() => inputCodigo.parentElement.classList.remove('flash-green'), 1000);
                
                document.getElementById(`cant_${id}`).focus();
            }
        }

        function agregarFila(codigo = '', descripcion = '', cantidad = '', importe = '', margen = 40) {
            filaCount++;
            const id = filaCount;
            
            const tr = document.createElement('tr');
            tr.className = 'fila-producto hover:bg-gray-50 transition';
            tr.setAttribute('data-id', id);
            
            tr.innerHTML = `
                <td class="px-2 py-2">
                    <input type="text" id="codigo_${id}" value="${codigo}" placeholder="Escanear..." 
                        onkeydown="manejarEscaner(event, ${id})" onblur="buscarEnDb(${id})"
                        class="w-32 p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 font-mono text-sm bg-gray-50">
                </td>
                <td class="px-2 py-2">
                    <input type="text" id="desc_${id}" value="${descripcion}" placeholder="Nombre del producto" class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
                </td>
                <td class="px-2 py-2">
                    <input type="number" id="cant_${id}" value="${cantidad}" oninput="recalcularFila(${id})" class="w-20 p-2 border border-gray-300 rounded text-right focus:outline-none focus:border-blue-500">
                </td>
                <td class="px-2 py-2">
                    <input type="number" id="imp_${id}" value="${importe}" oninput="recalcularSumaNeto()" class="input-importe w-28 p-2 border border-gray-300 rounded text-right focus:outline-none focus:border-blue-500 font-semibold text-blue-900 bg-blue-50">
                </td>
                <td class="px-2 py-2 font-bold text-blue-700 bg-blue-50 text-right rounded-md border-r-2 border-white" id="costo_${id}">$0.00</td>
                <td class="px-2 py-2">
                    <div class="flex items-center justify-end">
                        <input type="number" id="margen_${id}" value="${margen}" oninput="recalcularFila(${id})" class="w-16 p-2 border border-gray-300 rounded text-right focus:outline-none focus:border-blue-500">
                        <span class="ml-1 text-gray-500 font-bold">%</span>
                    </div>
                </td>
                <td class="px-2 py-2 font-bold text-green-700 bg-green-100 text-xl text-right rounded-md" id="precio_${id}">$0.00</td>
                <td class="px-2 py-2 text-center">
                    <button onclick="this.closest('tr').remove(); recalcularSumaNeto();" class="text-red-400 hover:text-red-700 font-bold text-xl px-2">&times;</button>
                </td>
            `;
            
            document.getElementById('tablaProductos').appendChild(tr);
            recalcularFila(id);
            
            if (!codigo) {
                setTimeout(() => document.getElementById(`codigo_${id}`).focus(), 10);
            }
        }

        // --- INICIALIZACIÓN ---
        document.getElementById('facturaTotal').addEventListener('input', actualizarCoeficiente);
        
        inicializarBaseDatos();
        agregarFila();
    </script>
</body>
</html>
