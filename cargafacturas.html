<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesador de Facturas a XLS</title>
    <!-- Librerías necesarias mediante CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- SortableJS para Drag & Drop compatible con pantallas táctiles (móviles) -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        body { font-family: system-ui; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .panel { border: 1px solid #ccc; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        
        /* Estilos para arrastrar y soltar */
        .drag-handle { cursor: grab; text-align: center; color: #888; font-size: 1.2rem; user-select: none; }
        .drag-handle:active { cursor: grabbing; }
        .sortable-ghost { opacity: 0.4; background-color: #f0f8ff; }
        .sortable-drag { background-color: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.15); }

        .btn { padding: 8px 16px; margin: 4px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
        .btn-danger { background-color: #dc3545; color: white; }
        .actions { margin-top: 1rem; display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="panel">
        <h2>Cargar Factura de Compra</h2>
        <input type="file" id="invoiceImage" accept="image/*" capture="environment" style="margin-bottom: 10px;">
        <br>
        <button class="btn btn-primary" onclick="procesarFactura()">Procesar Factura (OCR)</button>
        <button class="btn btn-danger" onclick="limpiarFormulario()">Limpiar para Nueva Factura</button>
        <p id="status" style="font-weight: bold; color: #555;">Esperando acción...</p>
    </div>

    <h3>Datos a Exportar (Arrastra las filas para reordenar)</h3>
    <div style="overflow-x: auto;">
        <table id="previewTable">
            <thead>
                <tr>
                    <th style="width: 40px;"></th> <!-- Columna para el ícono de arrastrar -->
                    <th>CODIGO</th><th>CODEBAR</th><th>NOMBRE</th><th>P COSTO</th><th>P VENTA</th><th>P MAYOREO</th><th>DEPTO</th><th>INV</th><th>MIN</th>
                </tr>
            </thead>
            <tbody id="previewBody"></tbody>
        </table>
    </div>
    
    <div class="actions">
        <button class="btn btn-success" onclick="exportarExcel()">Descargar IMPORTAR PRODUCTOS.xls</button>
        <button class="btn btn-success" onclick="exportarCSV()">Descargar CSV</button>
    </div>

    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXw6JguUct7dv50KyEPEQMqPD-WtOrBlfnWuMV_Yx91v5ty1YmNNXzZ9G-YPYlBw/pub?output=csv";
        let baseDatosCSV = [];
        let productosProcesados = [];

        // Inicializar SortableJS en la tabla
        const tbody = document.getElementById('previewBody');
        Sortable.create(tbody, {
            handle: '.drag-handle', // Solo se arrastra desde el ícono
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: function (evt) {
                // Sincronizar el array de datos con el nuevo orden visual de la tabla
                const oldIndex = evt.oldIndex;
                const newIndex = evt.newIndex;
                
                // Mover el elemento dentro del array
                const elementoMovido = productosProcesados.splice(oldIndex, 1)[0];
                productosProcesados.splice(newIndex, 0, elementoMovido);
                
                console.log("Nuevo orden establecido:", productosProcesados);
            }
        });

        // 1. Cargar la base de datos de Google Sheets al iniciar
        Papa.parse(CSV_URL, {
            download: true,
            header: true,
            complete: function(results) {
                baseDatosCSV = results.data;
                document.getElementById('status').innerText = `Base de datos cargada (${baseDatosCSV.length} artículos). Esperando factura...`;
            }
        });

        // 2. Función principal de OCR y procesamiento
        async function procesarFactura() {
            const imageInput = document.getElementById('invoiceImage');
            const statusLabel = document.getElementById('status');

            if (!imageInput.files[0]) return alert("Sube o toma una foto primero.");
            
            statusLabel.innerText = "Leyendo imagen con OCR (esto puede tomar unos segundos)...";
            
            try {
                const worker = await Tesseract.createWorker({
                    logger: m => console.log(m)
                });
                await worker.loadLanguage('spa');
                await worker.initialize('spa');
                
                const ret = await worker.recognize(imageInput.files[0]);
                const textoExtraido = ret.data.text;
                
                await worker.terminate();

                statusLabel.innerText = "Imagen procesada. Analizando líneas...";
                analizarLineasFactura(textoExtraido);

            } catch (error) {
                statusLabel.innerText = "Error en OCR: " + error;
            }
        }

        // 3. Análisis de texto y validación manual
        function analizarLineasFactura(texto) {
            const lineas = texto.split('\n').filter(l => l.trim().length > 5);
            productosProcesados = [];

            lineas.forEach(linea => {
                let nombreAprox = linea.replace(/[0-9$,]/g, '').trim(); 
                let costoMatch = linea.match(/\d+[\.,]\d{2}/);
                let costoUnitario = costoMatch ? parseFloat(costoMatch[0].replace(',', '.')) : 0;

                if(nombreAprox.length < 3) return;

                let coincidencia = baseDatosCSV.find(item => 
                    item.NOMBRE && item.NOMBRE.toUpperCase().includes(nombreAprox.toUpperCase())
                );

                let codigo = "";
                let nombreFinal = nombreAprox;

                if (coincidencia) {
                    codigo = coincidencia.CODIGO || coincidencia.CODEBAR;
                    nombreFinal = coincidencia.NOMBRE;
                } else {
                    codigo = prompt(`⚠️ Sistema: No se encontró código para el artículo: "${nombreAprox}".\n\nPor favor, ingrese el código de barras o código interno manualmente:`);
                    if (!codigo || codigo.trim() === "") {
                        codigo = "SIN_CODIGO"; 
                    }
                }

                let margenNormal = 1.45;
                let margenMayoreo = 1.25;
                let precioVenta = costoUnitario * margenNormal;
                let precioMayoreo = costoUnitario * margenMayoreo;

                productosProcesados.push({
                    'CODIGO': codigo,
                    'CODEBAR': `*${codigo}*`,
                    'NOMBRE': nombreFinal,
                    'P COSTO': costoUnitario.toFixed(2),
                    'P VENTA': `$${precioVenta.toFixed(2)}`,
                    'P MAYOREO': precioMayoreo.toFixed(2),
                    'DEPARTAMENTO': 'KIMAR',
                    'INVENTARIO': 5,
                    'IN MINIMO': 0
                });
            });

            actualizarVistaPrevia();
            document.getElementById('status').innerText = "Procesamiento completo. Arrastra las filas si necesitas reordenarlas.";
        }

        // 4. Actualizar tabla HTML (ahora con ícono de arrastre)
        function actualizarVistaPrevia() {
            tbody.innerHTML = '';
            productosProcesados.forEach((prod, index) => {
                tbody.innerHTML += `<tr>
                    <td class="drag-handle" title="Arrastrar para mover">☰</td>
                    <td>${prod['CODIGO']}</td>
                    <td>${prod['CODEBAR']}</td>
                    <td>${prod['NOMBRE']}</td>
                    <td>${prod['P COSTO']}</td>
                    <td>${prod['P VENTA']}</td>
                    <td>${prod['P MAYOREO']}</td>
                    <td>${prod['DEPARTAMENTO']}</td>
                    <td>${prod['INVENTARIO']}</td>
                    <td>${prod['IN MINIMO']}</td>
                </tr>`;
            });
        }

        // 5. Función para limpiar la pantalla
        function limpiarFormulario() {
            document.getElementById('invoiceImage').value = '';
            productosProcesados = [];
            actualizarVistaPrevia();
            document.getElementById('status').innerText = "Formulario limpio. Esperando nueva factura...";
        }

        // 6. Exportar Excel
        function exportarExcel() {
            if (productosProcesados.length === 0) return alert("No hay datos para exportar.");
            const ordenColumnas = ["CODIGO", "CODEBAR", "NOMBRE", "P COSTO", "P VENTA", "P MAYOREO", "DEPARTAMENTO", "INVENTARIO", "IN MINIMO"];
            
            // Los datos se exportarán en el orden actual del array (el cual se modifica al arrastrar)
            const hoja = XLSX.utils.json_to_sheet(productosProcesados, { header: ordenColumnas });
            const libro = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(libro, hoja, "PRODUCTOS");
            
            XLSX.writeFile(libro, "IMPORTAR PRODUCTOS.xls");
        }

        // 7. Exportar CSV
        function exportarCSV() {
            if (productosProcesados.length === 0) return alert("No hay datos para exportar.");
            const ordenColumnas = ["CODIGO", "CODEBAR", "NOMBRE", "P COSTO", "P VENTA", "P MAYOREO", "DEPARTAMENTO", "INVENTARIO", "IN MINIMO"];
            const hoja = XLSX.utils.json_to_sheet(productosProcesados, { header: ordenColumnas });
            const csv = XLSX.utils.sheet_to_csv(hoja);
            
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", "IMPORTAR PRODUCTOS.csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
